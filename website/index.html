<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>yuban — 靜態站</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <h1>yuban</h1>
      <p>個人/專案靜態網站範本</p>
    </header>

    <main class="content">
      <section>
        <h2>歡迎</h2>
        <p>這是靜態站的起始頁，放在 <code>website/</code> 下。</p>
      </section>

      <section>
        <h2>資源搜尋（MVP 範例）</h2>
        <div class="search-bar">
          <input id="q" placeholder="搜尋關鍵字（標題/摘要/標籤）" />
          <select id="age-filter">
            <option value="">所有年齡</option>
            <option value="0-3m">0-3m</option>
            <option value="0-6m">0-6m</option>
            <option value="12-36m">12-36m</option>
          </select>
          <button id="searchBtn">搜尋</button>
        </div>
        <div id="results"></div>
      </section>
    </main>

    <footer class="site-footer">
      <small>© yuban</small>
    </footer>
    <script src="search.js"></script>
  </body>
</html>
